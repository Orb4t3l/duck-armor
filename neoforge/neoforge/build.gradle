apply plugin: 'com.github.johnrengelman.shadow'

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-neoforge-1.20.1:${rootProject.geckolib_version}"

    forgeRuntimeLibrary "com.eliotlash.mclib:mclib:20"

    // modImplementation "curse.maven:untitled-duck-mod-PROJECTID:NEOFORGE-FILEID"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

tasks.named("processResources") {
    inputs.property "mod_version", rootProject.mod_version
    filesMatching("META-INF/mods.toml") {
        expand "version": rootProject.mod_version
    }
}

tasks.named("shadowJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

tasks.named("remapJar") {
    inputFile = shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

tasks.named("jar") {
    archiveClassifier = "dev"
}

tasks.named("sourcesJar") {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) { skip() }
}
